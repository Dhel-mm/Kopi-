<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi; Calamba Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="Account.css">
  <link rel="icon" href="HomePic/Logo.png"/>
</head>
<body>

    <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="#">
        <img src="HomePic/Logo.png" alt="Kopi logo">
      </a>

      <a class="location" href="https://www.google.com/maps/place/Kopi;+Calamba+Main/@14.2151839,121.1813173,273m/data=!3m1!1e3!4m15!1m8!3m7!1s0x33bd61f7b1cf1317:0x6944391c174ae7b5!2sKopi;+Calamba+Main!8m2!3d14.2151266!4d121.1814945!10e9!16s%2Fg%2F11ny11vdb_!3m5!1s0x33bd61f7b1cf1317:0x6944391c174ae7b5!8m2!3d14.2151266!4d121.1814945!16s%2Fg%2F11ny11vdb_!5m1!1e4?entry=ttu&g_ep=EgoyMDI2MDYyNC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">
        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
        <span>Lingga, Calamba City</span>
      </a>

      <p class="nav-tagline">Not just coffee, it's happiness</p>
      <div class="nav-links">
        <a class="nav-link" href="Homepage.html">
          <i class="bi bi-house-door-fill" aria-hidden="true"></i>
          <span>Home</span>
        </a>
        <a class="nav-link" href="Menu.html">
          <i class="bi bi-cup-hot" aria-hidden="true"></i>
          <span>Menu</span>
        </a>
        <a class="nav-link" href="Cart.html">
          <i class="bi bi-cart-fill" aria-hidden="true"></i>
          <span class="cart-count" data-cart-count>0</span>
          <span>Cart</span>
        </a>
        <a class="nav-link active" href="Account.html">
          <i class="bi bi-person-fill" aria-hidden="true"></i>
          <span>Account</span>
        </a>
      </div>
    </nav>
  </header>
  

  <main class="account-page">
    <section class="account-shell" aria-labelledby="account-title">
      <header class="account-heading">
        <a class="close-account" href="Homepage.html" aria-label="Close account">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </a>

        <h1 id="account-title">
          <span class="desktop-title">Profile</span>
          <span class="mobile-title">My Account</span>
        </h1>
        <button class="sidebar-toggle" type="button" aria-label="Show account menu" aria-controls="accountSidebar" aria-expanded="false">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
      </header>
      <div class="account-layout">
        <aside class="account-sidebar" id="accountSidebar" aria-label="Account navigation">
          <nav class="account-menu">
            <h2>Account</h2>
            <a class="menu-item selected" href="#profile">
              <i class="bi bi-person-circle" aria-hidden="true"></i>
              <span>Profile</span>
            </a>
            <h2>Orders</h2>
            <a class="menu-item" href="#orders">
              <i class="bi bi-clipboard2-check" aria-hidden="true"></i>
              <span>My Orders</span>
            </a>
            <h2>Need Help?</h2>
            <a class="menu-item" href="#feedback">
              <i class="bi bi-star" aria-hidden="true"></i>
              <span>Feedback</span>
            </a>
            <a class="menu-item" href="#about">
              <i class="bi bi-lightbulb" aria-hidden="true"></i>
              <span>About Kopi;</span>
            </a>
          </nav>
          <a class="logout-btn" href="Homepage.html">Log Out</a>
        </aside>
        <section class="profile-panel" id="profile" aria-label="Profile details">
          <form class="profile-form">
            <div class="photo-row">
              <i class="bi bi-person-circle profile-avatar" aria-hidden="true"></i>
              <div class="photo-controls">
                <legend>Profile Picture</legend>
                <div class="photo-actions">
                  <button class="upload-btn" type="button"><i class="bi bi-cloud-arrow-up-fill" aria-hidden="true"></i>Upload Image</button>
                  <button class="outline-btn" type="button">Remove</button>
                </div>
                <small>We support PNGs, JPEGs and GIFs under 10MB</small>
              </div>
            </div>
            <div class="form-grid">
              <label>First Name<input type="text" value="Sho"></label>
              <label>Last Name<input type="text" value="Smith"></label>
              <label>Email<input type="email" value="sho21@gmail.com"></label>
              <div class="email-action">
                <button class="outline-btn" type="button">Edit email</button>
              </div>
            </div>
            <fieldset class="password-fields"><legend>Password</legend><label>Current password<input type="password" value="@sho2004"></label><label>New password<input type="password"></label><label>Confirm new password<input type="password"></label><button class="outline-btn change-password" type="button">Change password</button></fieldset>
          </form>
        </section>
      </div>
    </section>
  </main>
  <script src="Store.js"></script>
  <script>
    const sidebarToggle = document.querySelector(".sidebar-toggle");
    const accountSidebar = document.querySelector(".account-sidebar");

    sidebarToggle?.addEventListener("click", () => {
      const isOpen = accountSidebar.classList.toggle("is-open");
      sidebarToggle.setAttribute("aria-expanded", String(isOpen));
    });

    accountSidebar?.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        accountSidebar.classList.remove("is-open");
        sidebarToggle?.setAttribute("aria-expanded", "false");
      });
    });
  </script>
</body>
</html>
