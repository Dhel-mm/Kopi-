<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi; Login</title>
  <link rel="stylesheet" href="Login.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="Customer/HomePic/Logo.png"/>

</head>
<body>

  <div class="container">
    <img src="Customer/HomePic/Intro.JPG" alt="Kopi background" class="bg-image">
    <div class="overlay"></div>

    <img src="Customer/HomePic/Logo.png" alt="Kopi Logo" class="logo-image">

    <div class="logo">
      <h2>Kopi;</h2>
      <p>EST 2021</p>
    </div>

    <a href="#" class="profile-icon">
  <i class="bi bi-person-gear"></i>
</a>

    <div class="login-card">
      <h2 class="card-title">Login or Sign Up</h2>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="kopi@example.com">
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="passwordInput" placeholder="••••••••••••••">
<span class="toggle-password" onclick="togglePassword()">
  <i class="bi bi-eye-slash"></i>
</span>
        </div>
      </div>

      <div class="row-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>
          <div class="login-btn">
        <a href="customer/Homepage.html">Login</a >
  </div>
  
      <p class="signup-text">Don't have an account? <a href="Admin/homepage.html">Sign up</a></p>
    </div>

  </div>

<script>
function togglePassword() {
  const input = document.getElementById('passwordInput');
  const icon = document.querySelector('.toggle-password i');

  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');
  } else {
    input.type = 'password';
    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');
  }
}
</script>

</body>
</html>
